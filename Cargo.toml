[package]
name = "antisplit-rs"
version = "0.1.0"
description = "Merge Android split APK bundles into one installable APK"
edition = "2024"
rust-version = "1.85"

[dependencies]
eframe = "0.31"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
serde_json = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
